<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>This domain is blocked</title>
  <style>
    /* Self-contained: Squid serves this page on its own, so no external assets. */
    :root {
      --bg-soft: #11100f; --panel: #171310; --panel-raised: #1d1713;
      --copper-light: #e0a070; --text: #d8d1cb; --heading: #f7f4f1; --muted: #aaa19a;
      --border: rgba(193, 116, 71, 0.30); --border-strong: rgba(213, 145, 94, 0.55);
      --err-bg: rgba(220, 90, 80, 0.14); --err-fg: #f2a59c;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-soft: #f7f3ef; --panel: #ffffff; --panel-raised: #f4ede6;
        --copper-light: #75401f; --text: #302923; --heading: #201a16; --muted: #625850;
        --border: rgba(138, 78, 46, 0.25); --border-strong: rgba(138, 78, 46, 0.5);
        --err-bg: #fbeae8; --err-fg: #8c2a20;
        color-scheme: light;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 1rem;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-soft); color: var(--text);
      font: 15px/1.55 Inter, Aptos, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .card {
      flex: 1 1 auto; max-width: 480px; text-align: center;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 2rem;
    }
    .tag {
      display: inline-block; font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; background: var(--err-bg); color: var(--err-fg);
      padding: 0.15rem 0.5rem; border-radius: 4px; margin-bottom: 0.9rem;
    }
    h1 { color: var(--heading); font-size: 1.6rem; line-height: 1.25; margin: 0 0 0.5rem; }
    p { margin: 0 0 0.75rem; }
    .domain {
      background: var(--panel-raised); border: 1px solid var(--border-strong); border-radius: 8px;
      padding: 0.7rem 1rem; margin: 1.25rem 0; word-break: break-all; color: var(--heading);
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; font-size: 0.9rem;
    }
    .domain span { display: block; color: var(--muted); font-family: inherit; font-size: 0.8rem; margin-bottom: 0.2rem; }
    .muted { color: var(--muted); font-size: 0.85rem; margin: 0; }
    .brand { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Blocked</span>
    <h1>This domain is blocked</h1>
    <p>You are using a <strong>PAW</strong>. Do you really need access to this site?</p>
    <div class="domain"><span>Blocked address</span>%U</div>
    <p class="muted">If you believe this is in error, please contact your IT administrator.</p>
    <div class="brand">PAW Proxy Pilot</div>
  </main>
</body>
</html>
