{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="login card">
  <h1>PAW Proxy Pilot</h1>
  <p class="muted">Web proxy allow list for Privileged Access Workstations. Sign in to manage it.</p>
  <form class="form" method="post" autocomplete="on">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-lg" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
