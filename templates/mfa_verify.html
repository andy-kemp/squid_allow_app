{% extends "base.html" %}
{% block title %}Verify MFA{% endblock %}
{% block content %}
<section class="login card">
  <h1>Verify it's you</h1>
  <p class="muted">Enter the 6-digit code from your authenticator app.</p>
  <form class="form" method="post">
    <div class="field">
      <label for="code">Authenticator code</label>
      <input class="code-input" type="text" name="code" id="code" maxlength="6" inputmode="numeric" required autofocus autocomplete="one-time-code" placeholder="123456">
    </div>
    <button class="btn btn-lg" type="submit">Verify</button>
  </form>
</section>
{% endblock %}
