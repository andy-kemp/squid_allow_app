{% extends "base.html" %}
{% block title %}Reset MFA{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Reset MFA</h1>
    <p class="muted">{{ user.username }} will have to enrol their authenticator app again at next sign-in.</p>
  </div>
</div>
<form class="card form" method="post">
  <p>Reset MFA for <strong>{{ user.username }}</strong>?</p>
  <div class="form-actions">
    <button type="submit" class="btn btn-danger">Reset MFA</button>
    <a class="btn btn-ghost" href="{{ url_for('admin_users') }}">Cancel</a>
  </div>
</form>
{% endblock %}
