{% extends "base.html" %}
{% block title %}Add user{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Add user</h1>
    <p class="muted">They'll set up MFA the first time they sign in.</p>
  </div>
</div>
<form class="card form" method="post">
  <div class="field">
    <label for="username">Username</label>
    <input type="text" name="username" id="username" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" name="email" id="email" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" required autocomplete="new-password">
  </div>
  <div class="field">
    <label for="admin_level">Admin level</label>
    <select name="admin_level" id="admin_level" required>
      <option value="0">User</option>
      {% if session.admin_level == 99 %}
      <option value="1">User Admin</option>
      <option value="99">God Admin</option>
      {% elif session.admin_level > 0 %}
      <option value="1">User Admin</option>
      {% endif %}
    </select>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn">Add user</button>
    <a class="btn btn-ghost" href="{{ url_for('admin_users') }}">Cancel</a>
  </div>
</form>
{% endblock %}
