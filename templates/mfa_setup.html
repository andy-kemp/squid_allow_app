{% extends "base.html" %}
{% block title %}Set up MFA{% endblock %}
{% block content %}
<section class="login card">
  <h1>Set up MFA</h1>
  <p class="muted">Scan this QR code with your authenticator app.</p>
  <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?data={{ qr_uri|urlencode }}&size=180x180" alt="MFA QR code" width="196" height="196">
  <p class="muted small">Or enter this key manually:<br><span class="secret">{{ secret }}</span></p>
  <form class="form" method="post">
    <div class="field">
      <label for="code">Authenticator code</label>
      <input class="code-input" type="text" name="code" id="code" maxlength="6" inputmode="numeric" required autocomplete="one-time-code" placeholder="123456" pattern="[0-9]{6}">
      <p class="hint">The 6-digit code your app shows, without spaces.</p>
    </div>
    <button class="btn btn-lg" type="submit">Activate MFA</button>
  </form>
</section>
{% endblock %}
