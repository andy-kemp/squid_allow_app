{% extends "base.html" %}
{% block title %}First-time setup{% endblock %}
{% block content %}
<section class="login card">
  <h1>Welcome to PAW Proxy Pilot</h1>
  <p class="muted">Create the first administrator. This account gets full (level 99) access.</p>
  <form class="form" method="post" autocomplete="off">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="new-password">
    </div>
    <div class="field">
      <label for="password2">Confirm password</label>
      <input id="password2" name="password2" type="password" required autocomplete="new-password">
    </div>
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required>
    </div>
    <button class="btn btn-lg" type="submit">Continue</button>
    <p class="hint">Next you'll set up multi-factor authentication (MFA).</p>
  </form>
</section>
{% endblock %}
